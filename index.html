<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Interactive Counter PWA</title>
  
  <!-- PWA Meta Tags -->
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Counter PWA">
  <meta name="description" content="A fast, offline-ready Progressive Web App counter with local persistence.">

  <!-- Dynamic Manifest & Apple Touch Icon placeholders (populated via JS) -->
  <link id="pwa-manifest" rel="manifest">
  <link id="apple-touch-icon" rel="apple-touch-icon">
  <link id="favicon" rel="icon" type="image/png">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      -webkit-tap-highlight-color: transparent;
    }

    /* Preserved smooth pulse animation */
    .display-number {
      transition: transform 0.12s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .display-number.pulse {
      transform: scale(1.12);
    }

    /* Subtle slide-up animation for PWA banner */
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-slide-up {
      animation: slideUp 0.35s ease-out forwards;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 selection:bg-sky-500 selection:text-white">

  <!-- Main Counter Card -->
  <main class="w-full max-w-sm bg-slate-800/90 backdrop-blur-md p-7 sm:p-8 rounded-3xl shadow-2xl border border-slate-700/80 text-center relative overflow-hidden">
    
    <!-- Top Header: App Icon Preview & PWA Status Badge -->
    <div class="flex items-center justify-between mb-6 pb-4 border-b border-slate-700/60">
      <div class="flex items-center gap-3 text-left">
        <!-- Live Preview of the Generated Blue & White App Icon -->
        <div class="relative group">
          <img 
            id="icon-preview" 
            alt="Blue and White App Icon" 
            class="w-11 h-11 rounded-xl shadow-md border border-sky-400/30 object-cover transition-transform duration-200 group-hover:scale-105"
          />
          <span class="absolute -bottom-1 -right-1 w-3.5 h-3.5 bg-emerald-500 border-2 border-slate-800 rounded-full" title="App Icon Ready"></span>
        </div>
        <div>
          <h1 class="text-xs font-bold uppercase tracking-widest text-slate-300">Counter App</h1>
          <p class="text-[11px] text-slate-400 font-medium">Blue &amp; White Edition</p>
        </div>
      </div>

      <!-- Offline / PWA Readiness Pill -->
      <div id="pwa-status-badge" class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[11px] font-semibold bg-slate-900/80 text-sky-400 border border-slate-700">
        <span id="status-dot" class="w-2 h-2 rounded-full bg-sky-400 animate-pulse"></span>
        <span id="status-text">Initializing</span>
      </div>
    </div>

    <!-- Counter Display -->
    <div class="my-6 sm:my-8">
      <div 
        id="counter-display" 
        class="display-number text-7xl sm:text-8xl font-extrabold text-sky-400 tracking-tight leading-none select-none drop-shadow-sm"
        aria-live="polite"
      >0</div>
      <p class="text-xs text-slate-500 mt-3 font-medium">Saved automatically to device</p>
    </div>
    
    <!-- Controls: Iterate -->
    <div class="flex flex-col gap-3 mt-6">
      <button 
        id="iterate-btn" 
        class="w-full py-4 px-6 bg-sky-600 hover:bg-sky-500 active:bg-sky-700 active:translate-y-0.5 text-white font-semibold text-lg rounded-2xl shadow-lg shadow-sky-600/30 transition-all duration-150 cursor-pointer focus:outline-none focus:ring-2 focus:ring-sky-400 focus:ring-offset-2 focus:ring-offset-slate-800"
      >
        Iterate (+1)
      </button>
    </div>

    <!-- Sleek In-App PWA Install Banner (Shown when installable or via manual guide) -->
    <div id="install-banner" class="hidden mt-6 pt-5 border-t border-slate-700/70 animate-slide-up">
      <div class="bg-slate-900/90 border border-sky-500/30 rounded-2xl p-3.5 flex items-center justify-between gap-3 text-left">
        <div class="flex items-center gap-3 min-w-0">
          <img id="banner-icon-preview" alt="App Icon" class="w-10 h-10 rounded-xl shrink-0 shadow-sm" />
          <div class="truncate">
            <p class="text-xs font-bold text-slate-100 truncate">Install Counter PWA</p>
            <p class="text-[11px] text-slate-400 truncate">Add to Home Screen for offline use</p>
          </div>
        </div>
        <button 
          id="install-btn" 
          class="shrink-0 px-3.5 py-2 bg-white hover:bg-sky-50 text-sky-700 font-bold text-xs rounded-xl shadow transition-transform active:scale-95 cursor-pointer"
        >
          Install
        </button>
      </div>
    </div>
  </main>

  <!-- Subtle Footer Info for Testing PWA Capabilities -->
  <footer class="mt-5 text-center max-w-sm px-2">
    <p id="pwa-helper-note" class="text-xs text-slate-500 leading-relaxed">
      Blue &amp; white icons (192×192 &amp; 512×512) and Web App Manifest generated dynamically.
    </p>
  </footer>

  <script>
    /**
     * ============================================================================
     * 1. COUNTER LOGIC & LOCALSTORAGE PERSISTENCE
     * ============================================================================
     */
    const display = document.getElementById('counter-display');
    const iterateBtn = document.getElementById('iterate-btn');

    // Retrieve saved value or default to 0
    let count = parseInt(localStorage.getItem('app_count'), 10) || 0;

    function updateDisplay(animate = true) {
      display.textContent = count;
      try {
        localStorage.setItem('app_count', count);
      } catch (err) {
        console.warn('LocalStorage unavailable:', err);
      }

      if (animate) {
        display.classList.add('pulse');
        setTimeout(() => display.classList.remove('pulse'), 120);
      }
    }

    // Initialize display without pulse on first paint
    updateDisplay(false);

    iterateBtn.addEventListener('click', () => {
      count += 1;
      updateDisplay(true);
    });

    /**
     * ============================================================================
     * 2. BLUE & WHITE PWA ICON GENERATOR (HTML5 CANVAS -> PNG DATA URL)
     * ============================================================================
     * Generates crisp 192x192 and 512x512 blue-and-white icons programmatically
     * so the PWA is 100% self-contained in a single HTML file.
     */
    function generateBlueWhiteAppIcon(size) {
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');

      // 1. Rounded Square Clipping Path
      const radius = size * 0.22;
      ctx.beginPath();
      ctx.moveTo(radius, 0);
      ctx.lineTo(size - radius, 0);
      ctx.quadraticCurveTo(size, 0, size, radius);
      ctx.lineTo(size, size - radius);
      ctx.quadraticCurveTo(size, size, size - radius, size);
      ctx.lineTo(radius, size);
      ctx.quadraticCurveTo(0, size, 0, size - radius);
      ctx.lineTo(0, radius);
      ctx.quadraticCurveTo(0, 0, radius, 0);
      ctx.closePath();
      ctx.clip();

      // 2. Rich Blue Gradient Background
      const bgGrad = ctx.createLinearGradient(0, 0, size, size);
      bgGrad.addColorStop(0, '#0284c7'); // Sky 600
      bgGrad.addColorStop(0.5, '#0369a1'); // Sky 700
      bgGrad.addColorStop(1, '#1d4ed8'); // Blue 700
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, size, size);

      // 3. Subtle Top-Left White Radial Sheen for Depth
      const sheen = ctx.createRadialGradient(
        size * 0.25, size * 0.2, size * 0.05,
        size * 0.5, size * 0.5, size * 0.85
      );
      sheen.addColorStop(0, 'rgba(255, 255, 255, 0.24)');
      sheen.addColorStop(1, 'rgba(255, 255, 255, 0)');
      ctx.fillStyle = sheen;
      ctx.fillRect(0, 0, size, size);

      // 4. Crisp White Inner Ring / Badge
      const center = size / 2;
      const ringRadius = size * 0.34;
      ctx.beginPath();
      ctx.arc(center, center, ringRadius, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.92)';
      ctx.lineWidth = size * 0.045;
      ctx.stroke();

      // 5. Bold White "+1" Symbol in Center
      ctx.fillStyle = '#ffffff';
      ctx.font = `800 ${Math.round(size * 0.30)}px Inter, system-ui, -apple-system, sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.shadowColor = 'rgba(15, 23, 42, 0.25)';
      ctx.shadowBlur = size * 0.04;
      ctx.shadowOffsetY = size * 0.015;
      ctx.fillText('+1', center, center + size * 0.02);

      return canvas.toDataURL('image/png');
    }

    /**
     * ============================================================================
     * 3. DYNAMIC INLINE MANIFEST.JSON & SERVICE WORKER REGISTRATION
     * ============================================================================
     */
    const statusText = document.getElementById('status-text');
    const statusDot = document.getElementById('status-dot');
    const installBanner = document.getElementById('install-banner');
    const installBtn = document.getElementById('install-btn');
    const helperNote = document.getElementById('pwa-helper-note');
    let deferredInstallPrompt = null;

    function initPWA() {
      try {
        // Generate 192x192 and 512x512 blue & white PNG icons
        const icon192Url = generateBlueWhiteAppIcon(192);
        const icon512Url = generateBlueWhiteAppIcon(512);

        // Populate Apple Touch Icon, Favicon, and In-App Previews
        document.getElementById('apple-touch-icon').href = icon192Url;
        document.getElementById('favicon').href = icon192Url;
        document.getElementById('icon-preview').src = icon192Url;
        document.getElementById('banner-icon-preview').src = icon192Url;

        // Build Web App Manifest dynamically
        const manifestData = {
          name: 'Interactive Counter PWA',
          short_name: 'Counter',
          description: 'Offline-capable Interactive Counter Progressive Web App with Blue & White icon.',
          start_url: window.location.href,
          scope: './',
          display: 'standalone',
          orientation: 'portrait',
          background_color: '#0f172a',
          theme_color: '#0284c7',
          icons: [
            {
              src: icon192Url,
              sizes: '192x192',
              type: 'image/png',
              purpose: 'any maskable'
            },
            {
              src: icon512Url,
              sizes: '512x512',
              type: 'image/png',
              purpose: 'any maskable'
            }
          ]
        };

        const manifestBlob = new Blob([JSON.stringify(manifestData)], { type: 'application/manifest+json' });
        const manifestURL = URL.createObjectURL(manifestBlob);
        document.getElementById('pwa-manifest').setAttribute('href', manifestURL);

        // Register Inline Service Worker via Blob URL for Offline Caching
        registerInlineServiceWorker();
      } catch (error) {
        console.error('PWA setup error:', error);
        setStatusBadge('Web Mode', 'bg-amber-400', false);
      }
    }

    function setStatusBadge(label, dotColorClass, pulse = false) {
      statusText.textContent = label;
      statusDot.className = `w-2 h-2 rounded-full ${dotColorClass} ${pulse ? 'animate-pulse' : ''}`;
    }

    async function registerInlineServiceWorker() {
      // Check if running in standalone installed mode already
      const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
      if (isStandalone) {
        setStatusBadge('Installed App', 'bg-emerald-400', false);
        return;
      }

      if (!('serviceWorker' in navigator)) {
        setStatusBadge('Manifest Ready', 'bg-sky-400', false);
        return;
      }

      // Inline Service Worker script for cache-first offline support
      const swCode = `
        const CACHE_NAME = 'counter-pwa-v1';
        self.addEventListener('install', (event) => {
          self.skipWaiting();
          event.waitUntil(
            caches.open(CACHE_NAME).then((cache) => {
              return cache.addAll([self.location.origin + self.location.pathname]).catch(() => {});
            })
          );
        });

        self.addEventListener('activate', (event) => {
          event.waitUntil(self.clients.claim());
        });

        self.addEventListener('fetch', (event) => {
          if (event.request.method !== 'GET') return;
          event.respondWith(
            caches.match(event.request).then((cachedResponse) => {
              const fetchPromise = fetch(event.request)
                .then((networkResponse) => {
                  if (networkResponse && networkResponse.status === 200) {
                    const responseClone = networkResponse.clone();
                    caches.open(CACHE_NAME).then((cache) => cache.put(event.request, responseClone));
                  }
                  return networkResponse;
                })
                .catch(() => cachedResponse);
              return cachedResponse || fetchPromise;
            })
          );
        });
      `;

      try {
        const swBlob = new Blob([swCode], { type: 'application/javascript' });
        const swUrl = URL.createObjectURL(swBlob);
        await navigator.serviceWorker.register(swUrl);
        setStatusBadge('Offline Ready', 'bg-emerald-400', false);
      } catch (err) {
        // Sandboxed iframes/previews sometimes restrict Blob SW registration;
        // Manifest and Icons remain 100% active.
        console.info('Service Worker registration notice (expected in sandboxed previews):', err.message);
        setStatusBadge('PWA Ready', 'bg-emerald-400', false);
        helperNote.textContent = 'Manifest & Blue/White icons active. Host over HTTPS or localhost to activate full Service Worker & native install prompt.';
      }
    }

    /**
     * ============================================================================
     * 4. INSTALL PROMPT HANDLING (beforeinstallprompt & appinstalled)
     * ============================================================================
     */
    window.addEventListener('beforeinstallprompt', (e) => {
      // Prevent default mini-infobar and display our custom sleek banner
      e.preventDefault();
      deferredInstallPrompt = e;
      installBanner.classList.remove('hidden');
      setStatusBadge('Installable', 'bg-sky-400', true);
    });

    installBtn.addEventListener('click', async () => {
      if (!deferredInstallPrompt) return;
      deferredInstallPrompt.prompt();
      const { outcome } = await deferredInstallPrompt.userChoice;
      if (outcome === 'accepted') {
        installBanner.classList.add('hidden');
        setStatusBadge('Installed', 'bg-emerald-400', false);
      }
      deferredInstallPrompt = null;
    });

    window.addEventListener('appinstalled', () => {
      installBanner.classList.add('hidden');
      deferredInstallPrompt = null;
      setStatusBadge('Installed App', 'bg-emerald-400', false);
    });

    // Update badge live if user goes offline/online
    window.addEventListener('offline', () => setStatusBadge('Offline Mode', 'bg-amber-400', false));
    window.addEventListener('online', () => setStatusBadge('Offline Ready', 'bg-emerald-400', false));

    // Boot PWA features
    initPWA();
  </script>
</body>
</html>
