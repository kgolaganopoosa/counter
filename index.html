<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Counter</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #0f172a;
      color: #f8fafc;
    }

    .counter-card {
      background: #1e293b;
      padding: 2.5rem;
      border-radius: 1.5rem;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      border: 1px solid #334155;
      text-align: center;
      width: 100%;
      max-width: 380px;
    }

    .title {
      font-size: 0.875rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #94a3b8;
      margin-bottom: 1rem;
    }

    .display {
      font-size: 5rem;
      font-weight: 800;
      color: #38bdf8;
      line-height: 1;
      margin: 1.5rem 0 2rem;
      user-select: none;
      transition: transform 0.1s ease;
    }

    .display.pulse {
      transform: scale(1.1);
    }

    .controls {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .btn {
      appearance: none;
      border: none;
      outline: none;
      padding: 1rem;
      font-size: 1.125rem;
      font-weight: 600;
      border-radius: 0.75rem;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn-iterate {
      background-color: #0284c7;
      color: #ffffff;
      box-shadow: 0 4px 6px -1px rgba(2, 132, 199, 0.4);
    }

    .btn-iterate:hover {
      background-color: #0369a1;
    }

    .btn-iterate:active {
      transform: translateY(2px);
    }

    .btn-reset {
      background-color: transparent;
      color: #64748b;
      font-size: 0.875rem;
      padding: 0.5rem;
    }

    .btn-reset:hover {
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <main class="counter-card">
    <h1 class="title">Counter App</h1>
    <div id="counter-display" class="display">0</div>
    
    <div class="controls">
      <button id="iterate-btn" class="btn btn-iterate">Iterate (+1)</button>
    </div>
  </main>

  <script>
    const display = document.getElementById('counter-display');
    const iterateBtn = document.getElementById('iterate-btn');
    const resetBtn = document.getElementById('reset-btn');

    // Retrieve saved value or default to 0
    let count = parseInt(localStorage.getItem('app_count')) || 0;
    updateDisplay();

    function updateDisplay() {
      display.textContent = count;
      localStorage.setItem('app_count', count);
      
      // Trigger subtle pulse animation
      display.classList.add('pulse');
      setTimeout(() => display.classList.remove('pulse'), 100);
    }

    iterateBtn.addEventListener('click', () => {
      count += 1;
      updateDisplay();
    });

    resetBtn.addEventListener('click', () => {
      count = 0;
      updateDisplay();
    });
  </script>
</body>
</html>
